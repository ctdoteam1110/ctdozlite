name: "Task / Tracer-Bullet Ticket"
description: "Vertical slice or sub-task for feature/spec implementation"
title: "task(<scope>): <summary>"
labels: ["type:task"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for vertical slices decomposed from a plan, spec, or parent issue.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: "Parent issue and blockers"
      value: |
        - Parent: None
        - Blocked by: None
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: "End-to-end behaviour to build (avoid a layer-by-layer file inventory)"
      placeholder: "Concise description of the behaviour delivered..."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: "Observable acceptance criteria"
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: "Tests or manual steps that prove the slice works"
      value: |
        - [ ] `cargo test --locked`
        - [ ] Manual:
    validations:
      required: true
