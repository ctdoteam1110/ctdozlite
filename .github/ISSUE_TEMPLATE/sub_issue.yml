name: "Sub-Issue / Child Task"
description: "Child vertical slice linked to a parent Epic or Feature"
title: "task(<scope>): <summary>"
labels: ["type:task"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for child slices explicitly attached to a parent Epic or Feature via a native sub-issue link.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: "Parent issue number (mandatory) and blockers"
      value: |
        - Parent: #<parent_issue_number>
        - Blocked by: None
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: "End-to-end behaviour delivered by this slice"
      placeholder: "Concise description of the behaviour delivered..."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: "Observable acceptance criteria"
      value: |
        - [ ]
    validations:
      required: true
