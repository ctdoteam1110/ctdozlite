name: "Feature Request / Proposal"
description: "Propose a new capability, architectural change, or RFC"
title: "feat(<scope>): <summary>"
labels: ["type:feat"]
body:
  - type: markdown
    attributes:
      value: |
        Suggest an enhancement, capability, or RFC. Protocol or schema changes will require an ADR.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: "Motivation and problem statement: why is this needed?"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: "High-level approach, affected modules, and user-visible behaviour"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: "For protocol changes: capture path, observed error_code, upstream observation. Otherwise: user feedback or benchmark."
      value: |
        - Evidence / capture:
        - Observed error_code:
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Context
      description: "ADR/RFC references or alternatives considered"
      value: |
        - ADR / RFC: None
        - Alternatives considered:
    validations:
      required: true
