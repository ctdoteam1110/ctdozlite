name: "Bug Report"
description: "File an actionable bug report with reproduction steps"
title: "fix(<scope>): <summary>"
labels: ["type:fix"]
body:
  - type: markdown
    attributes:
      value: |
        Report a bug, crash, or wrong protocol behaviour.

        **Do not paste `session.json`, cookies, `zpw_sek`, `zpw_enk`, IMEI, phone numbers or raw captures.** Redact secrets before submitting.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: "What happened, and what you expected instead"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: "Minimal steps to reproduce the behaviour"
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - auth
        - net
        - chat
        - media
        - call
        - ui
        - store
        - ci
        - other
    validations:
      required: true
  - type: input
    id: error-code
    attributes:
      label: Server error_code (if any)
      description: "Numeric `error_code` from the Zalo response, e.g. 18022, 600, 429. Leave empty if not a server error."
      placeholder: "0 / 114 / 600 / ..."
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: "OS, app version/tag, interface (GUI/TUI), and redacted logs"
      value: |
        - OS / Version:
        - ctdozlite version:
        - Interface: GUI / TUI
        - Logs (redacted):
    validations:
      required: true
  - type: checkboxes
    id: secrets
    attributes:
      label: Secret check
      options:
        - label: "I confirm no session tokens, cookies, IMEI, phone numbers or raw captures are included."
          required: true
