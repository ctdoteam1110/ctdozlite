name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "book.toml"
      - "scripts/generate_feature_matrix.py"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  build-docs:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install mdBook
        run: |
          mkdir -p ~/.local/bin
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C ~/.local/bin
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build User Docs Site
        run: |
          python3 scripts/generate_feature_matrix.py || true
          mdbook build

  pr-guard:
    name: PR Quality & Security Guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect PR Diff & Security
        id: check
        shell: bash
        run: |
          set +e

          # 1. Check for leaked sensitive files
          LEAKED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '^(session\.json|.*\.db|.*\.log|dump/|.*\.pem|.*\.key|re-notes/voicecall_capture\.log|app_settings\.json)$' || true)
          if [ -n "$LEAKED_FILES" ]; then
            LEAK_STATUS="FAIL"
            LEAK_MSG="Phát hiện file nhạy cảm trong commit diff:<br>```<br>$LEAKED_FILES<br>```<br>-> **Yêu cầu loại bỏ file nhạy cảm trước khi merge!**"
          else
            LEAK_STATUS="PASS"
            LEAK_MSG="Không phát hiện file nhạy cảm hoặc credentials rò rỉ."
          fi

          # 2. Check Conventional Commits title
          PR_TITLE="${{ github.event.pull_request.title }}"
          if echo "$PR_TITLE" | grep -Eq '^(feat|fix|refactor|perf|test|docs|chore|ci|style)(\([a-z0-9_-]+\))?: .+'; then
            TITLE_STATUS="PASS"
            TITLE_MSG="Tiêu đề chuẩn Conventional Commits (`$PR_TITLE`)."
          else
            TITLE_STATUS="WARN"
            TITLE_MSG="Tiêu đề chưa đúng chuẩn Conventional Commits (ví dụ: `feat(ui): thêm nút...`)."
          fi

          # 3. Check PR description
          BODY="${{ github.event.pull_request.body }}"
          BODY_LEN=${#BODY}
          if [ $BODY_LEN -gt 40 ]; then
            BODY_STATUS="PASS"
            BODY_MSG="Mô tả PR đầy đủ thông tin ($BODY_LEN ký tự)."
          else
            BODY_STATUS="WARN"
            BODY_MSG="Mô tả PR khá ngắn. Vui lòng bổ sung mục tiêu (`## What`) và lý do (`## Why`)."
          fi

          echo "leak_status=$LEAK_STATUS" >> $GITHUB_OUTPUT
          echo "leak_msg<<EOF" >> $GITHUB_OUTPUT
          echo -e "$LEAK_MSG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "title_status=$TITLE_STATUS" >> $GITHUB_OUTPUT
          echo "title_msg<<EOF" >> $GITHUB_OUTPUT
          echo -e "$TITLE_MSG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "body_status=$BODY_STATUS" >> $GITHUB_OUTPUT
          echo "body_msg<<EOF" >> $GITHUB_OUTPUT
          echo -e "$BODY_MSG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post Checklist Comment to PR
        uses: actions/github-script@v7
        with:
          script: |
            const leakStatus = "${{ steps.check.outputs.leak_status }}";
            const leakMsg = `${{ steps.check.outputs.leak_msg }}`;
            const titleStatus = "${{ steps.check.outputs.title_status }}";
            const titleMsg = `${{ steps.check.outputs.title_msg }}`;
            const bodyStatus = "${{ steps.check.outputs.body_status }}";
            const bodyMsg = `${{ steps.check.outputs.body_msg }}`;

            function icon(status) {
              if (status === 'PASS') return '✅ **ĐẠT**';
              if (status === 'WARN') return '⚠️ **LƯU Ý**';
              if (status === 'FAIL') return '❌ **KHÔNG ĐẠT**';
              return '➖ **BỎ QUA**';
            }

            const commentBody = `### 🤖 ctdozlite PR Check Bot (Miễn phí 100%)

Chào bạn! Bot tự động đã phân tích Pull Request của bạn theo quy chuẩn của dự án:

| Hạng mục kiểm tra | Trạng thái | Chi tiết |
| :--- | :---: | :--- |
| **Bảo mật & Tránh rò rỉ dữ liệu** | ${icon(leakStatus)} | ${leakMsg} |
| **Chuẩn tiêu đề (Conventional Commits)** | ${icon(titleStatus)} | ${titleMsg} |
| **Mô tả Pull Request** | ${icon(bodyStatus)} | ${bodyMsg} |

---
*Ghi chú: Nếu có cảnh báo ⚠️ hoặc lỗi ❌, bạn chỉ cần sửa ở branch của mình và \`git push\` lại, bot sẽ tự động cập nhật!*`;

            const botTag = '### 🤖 ctdozlite PR Check Bot';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(c => c.body && c.body.includes(botTag));
            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
            }
