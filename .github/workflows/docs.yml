name: Docs

# Build trang tài liệu tĩnh (mdBook) từ docs/*.md.
#
# CHỈ build, CHƯA deploy. Lý do: Hostinger không cấp quyền truy cập cho contributor.
# Khi maintainer tạo được secret FTP/SFTP, thêm bước upload vào `public_html/docs/`
# (phương án C trong issue #20) — không cần sửa gì khác trong workflow này.
#
# TODO(#20): deploy sang https://ctdozlite.ctdo.net/docs/ qua FTP/SFTP.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "book.toml"
      - "scripts/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "book.toml"
      - "scripts/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4

      - name: Ghi trang "Đã biết" từ GitHub Issues
        run: ./scripts/gen-known-issues.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: mdbook build

      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: book/
          retention-days: 14
