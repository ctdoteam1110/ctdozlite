name: CI & Release

# Builds and tests QTzalo on every push / PR, and publishes a GitHub Release when either
#   * a tag `v<version>` is pushed (must equal the version in Cargo.toml), or
#   * the workflow is started manually with the input `release: true`
#     (the tag `v<version>` is created by the release job at the built commit).
#
# Cargo.toml is the single source of truth for the version.

on:
  push:
    branches:
      - main
      - "claude/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release (tag v<Cargo.toml version>) after a green build"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  APP_NAME: QTzalo

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Read version from Cargo.toml
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "::error::Could not read the package version from Cargo.toml"
            exit 1
          fi
          publish=false
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version v${version}"
              exit 1
            fi
            publish=true
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${{ inputs.release }}" = "true" ]; then
            publish=true
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"
          echo "Version: ${version} — publish release: ${publish}"

  test:
    name: Test (Linux)
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake pkg-config \
            libasound2-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: test
      - name: cargo test
        run: cargo test --locked

  windows:
    name: Windows (MSVC x64 + installer)
    needs: prepare
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      # Link the MSVC C runtime statically so the exe runs on a clean Windows install
      # without the Visual C++ Redistributable (vcruntime140.dll).
      RUSTFLAGS: "-C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install Rust (stable)
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: windows-crt-static
      - name: cargo test
        run: cargo test --locked
      - name: Build release binary
        run: cargo build --release --locked --bin zalo-rust
      - name: Show DLL dependencies
        shell: pwsh
        continue-on-error: true
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          $dumpbin = Get-ChildItem -Path "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          if ($dumpbin) { & $dumpbin.FullName /dependents target\release\zalo-rust.exe } else { Write-Host "dumpbin not found" }
      - name: Locate or install Inno Setup
        shell: pwsh
        run: |
          function Find-Iscc {
            $cmd = Get-Command iscc.exe -ErrorAction SilentlyContinue
            if ($cmd) { return $cmd.Source }
            foreach ($p in @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "${env:ProgramFiles}\Inno Setup 6\ISCC.exe")) {
              if (Test-Path $p) { return $p }
            }
            return $null
          }
          $iscc = Find-Iscc
          if (-not $iscc) {
            Write-Host "Inno Setup not found - installing via Chocolatey"
            choco install innosetup -y --no-progress
            $iscc = Find-Iscc
          }
          if (-not $iscc) { throw "ISCC.exe (Inno Setup 6) not found" }
          Write-Host "Using $iscc"
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build installer and portable exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & $env:ISCC "/DMyAppVersion=$env:VERSION" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          Copy-Item target\release\zalo-rust.exe "dist\$env:APP_NAME-$env:VERSION-portable-windows-x86_64.exe"
          $setup = "dist\$env:APP_NAME-$env:VERSION-setup-windows-x86_64.exe"
          if (-not (Test-Path $setup)) { throw "Installer $setup was not produced" }
          Get-ChildItem dist | Format-Table Name, Length
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: qtzalo-windows
          path: dist/*.exe
          if-no-files-found: error

  linux:
    name: Linux (.deb + .tar.gz)
    needs: prepare
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake pkg-config \
            libasound2-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: linux-release
      - name: Build release binary
        run: |
          cargo build --release --locked --bin zalo-rust
          strip target/release/zalo-rust
      - name: Package .deb
        run: |
          set -euo pipefail
          root=pkg_deb
          mkdir -p dist "$root/DEBIAN" "$root/usr/bin" "$root/usr/share/applications" \
            "$root/usr/share/icons/hicolor/256x256/apps" "$root/usr/share/doc/qtzalo"
          install -m 755 target/release/zalo-rust "$root/usr/bin/qtzalo"
          install -m 644 packaging/linux/qtzalo.desktop "$root/usr/share/applications/qtzalo.desktop"
          install -m 644 src/assets/app_icon.png "$root/usr/share/icons/hicolor/256x256/apps/qtzalo.png"
          install -m 644 README.md LICENSE-MIT LICENSE-APACHE "$root/usr/share/doc/qtzalo/"
          sed "s/@VERSION@/${VERSION}/" packaging/linux/debian-control.in > "$root/DEBIAN/control"
          dpkg-deb --build --root-owner-group "$root" "dist/qtzalo_${VERSION}_amd64.deb"
      - name: Package portable .tar.gz
        run: |
          set -euo pipefail
          stage="qtzalo-${VERSION}-linux-x86_64"
          mkdir -p "$stage"
          install -m 755 target/release/zalo-rust "$stage/qtzalo"
          install -m 755 packaging/linux/install.sh packaging/linux/uninstall.sh "$stage/"
          install -m 644 packaging/linux/qtzalo.desktop "$stage/qtzalo.desktop"
          install -m 644 src/assets/app_icon.png "$stage/qtzalo.png"
          install -m 644 README.md LICENSE-MIT LICENSE-APACHE "$stage/"
          tar -czf "dist/${stage}.tar.gz" "$stage"
          ls -l dist
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: qtzalo-linux
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS (Apple Silicon .dmg, best effort)
    needs: prepare
    runs-on: macos-latest
    continue-on-error: true
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version
      - name: Install Homebrew dependencies
        run: brew install cmake pkg-config opus
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: macos-release
      - name: Build app bundle and .dmg
        run: |
          set -euo pipefail
          cargo build --release --locked --bin zalo-rust
          app="dist/dmg/${APP_NAME}.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp target/release/zalo-rust "$app/Contents/MacOS/zalo-rust"
          cp packaging/macos/Info.plist "$app/Contents/Info.plist"
          plutil -replace CFBundleShortVersionString -string "$VERSION" "$app/Contents/Info.plist"
          plutil -replace CFBundleVersion -string "$VERSION" "$app/Contents/Info.plist"
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "$APP_NAME" -srcfolder dist/dmg -ov -format UDZO "dist/${APP_NAME}-${VERSION}-macos-arm64.dmg"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: qtzalo-macos
          path: dist/*.dmg
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [prepare, test, windows, linux, macos]
    if: >-
      always() &&
      needs.prepare.outputs.publish == 'true' &&
      needs.test.result == 'success' &&
      needs.windows.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: qtzalo-*
          path: release_assets
          merge-multiple: true
      - name: Checksums
        run: |
          set -euo pipefail
          cd release_assets
          ls -l
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create release
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. Bump the version in Cargo.toml before releasing again."
            exit 1
          fi
          # If the tag already exists it must point at the commit we just built.
          if ref_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" 2>/dev/null)"; then
            obj_type="$(jq -r '.object.type' <<<"$ref_json")"
            obj_sha="$(jq -r '.object.sha' <<<"$ref_json")"
            if [ "$obj_type" = "tag" ]; then
              obj_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${obj_sha}" --jq '.object.sha')"
            fi
            if [ "$obj_sha" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $tag already exists at $obj_sha, not at the built commit $GITHUB_SHA"
              exit 1
            fi
          fi
          notes="$(mktemp)"
          if [ -f .github/release-notes.md ]; then
            sed -e "s/{{VERSION}}/${VERSION}/g" -e "s/{{COMMIT}}/${GITHUB_SHA::7}/g" .github/release-notes.md > "$notes"
          else
            echo "QTzalo ${tag}" > "$notes"
          fi
          gh release create "$tag" release_assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "QTzalo ${tag}" \
            --notes-file "$notes" \
            --latest
          echo "Published https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}"
