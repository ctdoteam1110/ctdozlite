name: CI & Cross-Platform Release (.deb / .exe / .dmg)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  linux-deb:
    name: Linux (Ubuntu x86_64 + .deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config \
            libasound2-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev \
            libgtk-3-dev libopus-dev
      - name: Run test suite
        run: cargo test --locked
      - name: Build release binary & .deb package
        run: |
          cargo build --release --locked --bin zalo-rust
          cargo install cargo-deb --locked
          cargo deb --no-build
          mkdir -p dist
          cp target/debian/*.deb dist/
      - uses: actions/upload-artifact@v4
        with:
          name: ctdozlite-linux-deb
          path: dist/*.deb

  windows-exe:
    name: Windows (MSVC x86_64 + .exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run test suite
        run: cargo test --locked
      - name: Build release binary & installer
        shell: pwsh
        run: |
          cargo build --release --locked --bin zalo-rust
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\zalo-rust.exe dist\ctdozlite-portable-windows-x86_64.exe
          iscc packaging\windows\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: ctdozlite-windows-exe
          path: dist/*.exe

  macos-dmg:
    name: macOS (Apple Silicon + .dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Homebrew dependencies
        run: brew install cmake pkg-config opus
      - name: Run test suite
        run: cargo test --locked
      - name: Build release app bundle & .dmg
        run: |
          cargo build --release --locked --bin zalo-rust
          mkdir -p dist/dmg/ctdozlite.app/Contents/MacOS
          mkdir -p dist/dmg/ctdozlite.app/Contents/Resources
          cp target/release/zalo-rust dist/dmg/ctdozlite.app/Contents/MacOS/zalo-rust
          cp packaging/macos/Info.plist dist/dmg/ctdozlite.app/Contents/Info.plist
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "ctdozlite" -srcfolder dist/dmg -ov -format UDZO dist/ctdozlite_macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: ctdozlite-macos-dmg
          path: dist/*.dmg
