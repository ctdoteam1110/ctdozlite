name: CI & Cross-Platform Release (.deb / .rpm / .AppImage / .tar.gz / .exe / .dmg)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  # 0. Single source of truth for the release version. Every build job consumes this output.
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve version and validate release tag
        id: version
        run: |
          set -euo pipefail
          version=$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "ctdozlite") | .version')
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [[ "$tag_version" != "$version" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
              exit 1
            fi
            git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::Tag commit $GITHUB_SHA is not on main"
              exit 1
            fi
          fi

  # 1. Universal Linux packages built on Ubuntu 22.04 LTS (glibc 2.35, statically linked libopus + sqlite3 + rustls)
  # Produces: .deb (Debian/Ubuntu/Mint/Kali/Pop!_OS), .rpm (Fedora/RHEL/Rocky/Alma/openSUSE), .AppImage (all distros), .tar.gz (Arch/Void/Gentoo/any distro)
  linux-packages:
    name: Linux Multi-Format (.deb / .rpm / .AppImage / .tar.gz)
    needs: prepare
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install build & packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config \
            libasound2-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev \
            libgtk-3-dev rpm file desktop-file-utils libfuse2
      - name: Run test suite
        run: cargo test --locked
      - name: Build release binary (static libopus & sqlite3)
        run: |
          cargo build --release --locked --bin zalo-rust
          strip target/release/zalo-rust
          chmod +x packaging/linux/ctdozlite packaging/linux/install.sh packaging/linux/uninstall.sh
      - name: Package .deb (Debian / Ubuntu 22.04+ / Linux Mint / Kali / Pop!_OS / Zorin)
        run: |
          mkdir -p dist pkg_deb/DEBIAN pkg_deb/usr/bin pkg_deb/usr/share/applications pkg_deb/usr/share/icons/hicolor/256x256/apps
          cp target/release/zalo-rust pkg_deb/usr/bin/zalo-rust
          cp packaging/linux/ctdozlite pkg_deb/usr/bin/ctdozlite
          cp packaging/linux/ctdozlite.desktop pkg_deb/usr/share/applications/ctdozlite.desktop
          cp src/assets/app_icon.png pkg_deb/usr/share/icons/hicolor/256x256/apps/ctdozlite.png
          cat > pkg_deb/DEBIAN/control << EOF
          Package: ctdozlite
          Version: ${VERSION}
          Section: net
          Priority: optional
          Architecture: amd64
          Depends: libc6, libasound2 | libasound2t64, libx11-6, libxcb1, libxkbcommon0, libgl1
          Recommends: ffmpeg, zenity, xclip, wl-clipboard, fonts-noto-core
          Maintainer: TIPC1110 <tienichpc1110@gmail.com>
          Description: Lightweight native Zalo PC client written in Rust
          EOF
          dpkg-deb --build --root-owner-group pkg_deb "dist/ctdozlite_${VERSION}_amd64.deb"
      - name: Package .rpm (Fedora / RHEL / Rocky / AlmaLinux / CentOS / openSUSE)
        run: |
          mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cat > rpmbuild/SPECS/ctdozlite.spec << 'EOF'
          Name:           ctdozlite
          Version:        @VERSION@
          Release:        1
          Summary:        Native Zalo Desktop Client written in Rust
          License:        MIT OR Apache-2.0
          URL:            https://github.com/ctdoteam1110/ctdozlite
          BuildArch:      x86_64
          AutoReqProv:    no
          Requires:       alsa-lib, libX11, libxcb, libxkbcommon

          %description
          Lightweight native Zalo Desktop Client written in Rust (eframe/egui + ratatui).

          %install
          mkdir -p %{buildroot}/usr/bin
          mkdir -p %{buildroot}/usr/share/applications
          mkdir -p %{buildroot}/usr/share/icons/hicolor/256x256/apps
          install -m 755 %{_topdir}/../target/release/zalo-rust %{buildroot}/usr/bin/zalo-rust
          install -m 755 %{_topdir}/../packaging/linux/ctdozlite %{buildroot}/usr/bin/ctdozlite
          install -m 644 %{_topdir}/../packaging/linux/ctdozlite.desktop %{buildroot}/usr/share/applications/ctdozlite.desktop
          install -m 644 %{_topdir}/../src/assets/app_icon.png %{buildroot}/usr/share/icons/hicolor/256x256/apps/ctdozlite.png

          %files
          /usr/bin/zalo-rust
          /usr/bin/ctdozlite
          /usr/share/applications/ctdozlite.desktop
          /usr/share/icons/hicolor/256x256/apps/ctdozlite.png
          EOF
          sed -i "s/@VERSION@/${VERSION}/" rpmbuild/SPECS/ctdozlite.spec
          rpmbuild --define "_topdir $(pwd)/rpmbuild" -bb rpmbuild/SPECS/ctdozlite.spec
          cp rpmbuild/RPMS/x86_64/*.rpm "dist/ctdozlite-${VERSION}-1.x86_64.rpm"
      - name: Package .AppImage (Universal single-file executable for all Linux distros)
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp target/release/zalo-rust AppDir/usr/bin/zalo-rust
          cp packaging/linux/ctdozlite AppDir/usr/bin/ctdozlite
          cp packaging/linux/ctdozlite.desktop AppDir/ctdozlite.desktop
          cp packaging/linux/ctdozlite.desktop AppDir/usr/share/applications/ctdozlite.desktop
          cp src/assets/app_icon.png AppDir/ctdozlite.png
          cp src/assets/app_icon.png AppDir/.DirIcon
          cp src/assets/app_icon.png AppDir/usr/share/icons/hicolor/256x256/apps/ctdozlite.png
          cat > AppDir/AppRun << 'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          export PATH="${HERE}/usr/bin:${PATH}"
          if [ $# -eq 0 ]; then
              exec "${HERE}/usr/bin/zalo-rust" --gui
          else
              exec "${HERE}/usr/bin/zalo-rust" "$@"
          fi
          EOF
          chmod +x AppDir/AppRun
          curl -fsSL -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir "dist/ctdozlite-${VERSION}-x86_64.AppImage"
          chmod +x "dist/ctdozlite-${VERSION}-x86_64.AppImage"
      - name: Package portable .tar.gz with universal install.sh (Arch / Manjaro / Gentoo / Void / any Linux)
        run: |
          STAGE="ctdozlite-${VERSION}-linux-x86_64"
          mkdir -p "$STAGE"
          cp target/release/zalo-rust "$STAGE/zalo-rust"
          cp packaging/linux/ctdozlite "$STAGE/ctdozlite"
          cp packaging/linux/install.sh "$STAGE/install.sh"
          cp packaging/linux/uninstall.sh "$STAGE/uninstall.sh"
          cp packaging/linux/ctdozlite.desktop "$STAGE/ctdozlite.desktop"
          cp src/assets/app_icon.png "$STAGE/ctdozlite.png"
          cp README.md LICENSE-MIT LICENSE-APACHE "$STAGE/"
          chmod +x "$STAGE/zalo-rust" "$STAGE/ctdozlite" "$STAGE/install.sh" "$STAGE/uninstall.sh"
          tar -czf "dist/${STAGE}.tar.gz" "$STAGE"
      - uses: actions/upload-artifact@v4
        with:
          name: ctdozlite-linux-packages
          path: dist/*

  # 2. Legacy Linux build on Debian 11 Bullseye (glibc 2.31) for older distros (Ubuntu 20.04, Debian 11, Mint 20, RHEL/Rocky 8.x/9.x)
  linux-legacy-glibc231:
    name: Linux Legacy glibc 2.31 (Debian 11 / Ubuntu 20.04+)
    needs: prepare
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    container:
      image: rust:bullseye
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies & update Rust stable (Debian 11 Bullseye)
        run: |
          sed -i '/bullseye-security/d' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          apt-get update
          apt-get install -y --no-upgrade build-essential cmake pkg-config \
            libasound2-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev \
            libgtk-3-dev
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: bullseye-glibc231
      - name: Build legacy release binary & .deb + .tar.gz
        run: |
          cargo build --release --locked --bin zalo-rust
          strip target/release/zalo-rust
          chmod +x packaging/linux/ctdozlite packaging/linux/install.sh packaging/linux/uninstall.sh
          mkdir -p dist pkg_deb/DEBIAN pkg_deb/usr/bin pkg_deb/usr/share/applications pkg_deb/usr/share/icons/hicolor/256x256/apps
          cp target/release/zalo-rust pkg_deb/usr/bin/zalo-rust
          cp packaging/linux/ctdozlite pkg_deb/usr/bin/ctdozlite
          cp packaging/linux/ctdozlite.desktop pkg_deb/usr/share/applications/ctdozlite.desktop
          cp src/assets/app_icon.png pkg_deb/usr/share/icons/hicolor/256x256/apps/ctdozlite.png
          cat > pkg_deb/DEBIAN/control << EOF
          Package: ctdozlite
          Version: ${VERSION}
          Section: net
          Priority: optional
          Architecture: amd64
          Depends: libc6 (>= 2.31), libasound2 | libasound2t64
          Recommends: ffmpeg, zenity, xclip, wl-clipboard, fonts-noto-core
          Maintainer: TIPC1110 <tienichpc1110@gmail.com>
          Description: Lightweight native Zalo PC client written in Rust (glibc 2.31+ compatible)
          EOF
          dpkg-deb --build --root-owner-group pkg_deb "dist/ctdozlite_${VERSION}_legacy_glibc2.31_amd64.deb"

          STAGE="ctdozlite-${VERSION}-linux-x86_64-legacy-glibc2.31"
          mkdir -p "$STAGE"
          cp target/release/zalo-rust "$STAGE/zalo-rust"
          cp packaging/linux/ctdozlite "$STAGE/ctdozlite"
          cp packaging/linux/install.sh "$STAGE/install.sh"
          cp packaging/linux/uninstall.sh "$STAGE/uninstall.sh"
          cp packaging/linux/ctdozlite.desktop "$STAGE/ctdozlite.desktop"
          cp src/assets/app_icon.png "$STAGE/ctdozlite.png"
          cp README.md LICENSE-MIT LICENSE-APACHE "$STAGE/"
          chmod +x "$STAGE/zalo-rust" "$STAGE/ctdozlite" "$STAGE/install.sh" "$STAGE/uninstall.sh"
          tar -czf "dist/${STAGE}.tar.gz" "$STAGE"
      - uses: actions/upload-artifact@v4
        with:
          name: ctdozlite-linux-legacy
          path: dist/*

  windows-exe:
    name: Windows (MSVC x86_64 + .exe)
    needs: prepare
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run test suite
        run: cargo test --locked
      - name: Build release binary & installer
        shell: pwsh
        run: |
          cargo build --release --locked --bin zalo-rust
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\zalo-rust.exe "dist\ctdozlite-$($env:VERSION)-portable-windows-x86_64.exe"
          iscc "/DMyAppVersion=$($env:VERSION)" packaging\windows\installer.iss
          Move-Item dist\ctdozlite-setup-windows-x86_64.exe "dist\ctdozlite-$($env:VERSION)-setup-windows-x86_64.exe" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ctdozlite-windows-exe
          path: dist/*.exe

  macos-dmg:
    name: macOS (Apple Silicon arm64 + Intel x86_64 + Universal .dmg)
    needs: prepare
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      LIBOPUS_STATIC: "1"
      LIBOPUS_NO_PKG: "1"
      OPUS_STATIC: "1"
      OPUS_NO_PKG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Ensure CMake is available (without Homebrew dynamic libopus)
        run: |
          command -v cmake >/dev/null 2>&1 || brew install cmake
          cmake --version
      - name: Run test suite
        run: |
          CMAKE_TOOLCHAIN_FILE="$PWD/packaging/macos/toolchain-arm64.cmake" \
            cargo test --locked
      - name: Build release binaries (Apple Silicon arm64 + Intel x86_64 + Universal) & .dmg packages
        run: |
          set -euo pipefail
          VER="${VERSION:-0.0.3}"

          echo "=== [1/4] Building Apple Silicon (aarch64-apple-darwin) ==="
          CMAKE_TOOLCHAIN_FILE="$PWD/packaging/macos/toolchain-arm64.cmake" \
            cargo build --release --locked --target aarch64-apple-darwin --bin zalo-rust

          echo "=== [2/4] Building Mac Intel (x86_64-apple-darwin) ==="
          CMAKE_TOOLCHAIN_FILE="$PWD/packaging/macos/toolchain-x86_64.cmake" \
            cargo build --release --locked --target x86_64-apple-darwin --bin zalo-rust

          echo "=== [3/4] Creating Universal Binary (arm64 + x86_64) via lipo ==="
          mkdir -p target/universal-apple-darwin/release
          lipo -create \
            target/aarch64-apple-darwin/release/zalo-rust \
            target/x86_64-apple-darwin/release/zalo-rust \
            -output target/universal-apple-darwin/release/zalo-rust
          lipo -info target/universal-apple-darwin/release/zalo-rust

          echo "=== Verifying zero Homebrew dynamic library dependencies ==="
          otool -L target/aarch64-apple-darwin/release/zalo-rust
          otool -L target/x86_64-apple-darwin/release/zalo-rust
          if otool -L target/universal-apple-darwin/release/zalo-rust | grep -E '/opt/homebrew|/usr/local'; then
            echo "ERROR: Binary still links against Homebrew dylib!"
            exit 1
          fi

          echo "=== Generating AppIcon.icns from src/assets/app_icon.png ==="
          mkdir -p build_icon/AppIcon.iconset
          for sz in 16 32 128 256 512; do
            sips -s format png -z $sz $sz src/assets/app_icon.png --out "build_icon/AppIcon.iconset/icon_${sz}x${sz}.png" >/dev/null
            sz2=$((sz * 2))
            sips -s format png -z $sz2 $sz2 src/assets/app_icon.png --out "build_icon/AppIcon.iconset/icon_${sz}x${sz}@2x.png" >/dev/null
          done
          iconutil -c icns build_icon/AppIcon.iconset -o build_icon/AppIcon.icns || true

          mkdir -p dist

          package_dmg() {
            local bin_path="$1"
            local dmg_out="$2"
            local vol_name="$3"
            local stage_dir
            stage_dir="$(mktemp -d)"
            mkdir -p "$stage_dir/ctdozlite.app/Contents/MacOS"
            mkdir -p "$stage_dir/ctdozlite.app/Contents/Resources"
            cp "$bin_path" "$stage_dir/ctdozlite.app/Contents/MacOS/zalo-rust"
            chmod +x "$stage_dir/ctdozlite.app/Contents/MacOS/zalo-rust"
            cp packaging/macos/Info.plist "$stage_dir/ctdozlite.app/Contents/Info.plist"
            plutil -replace CFBundleShortVersionString -string "$VER" "$stage_dir/ctdozlite.app/Contents/Info.plist"
            printf 'APPL????' > "$stage_dir/ctdozlite.app/Contents/PkgInfo"
            if [ -f build_icon/AppIcon.icns ]; then
              cp build_icon/AppIcon.icns "$stage_dir/ctdozlite.app/Contents/Resources/AppIcon.icns"
            fi
            xattr -cr "$stage_dir/ctdozlite.app" || true
            codesign --force --deep --sign - "$stage_dir/ctdozlite.app"
            ln -s /Applications "$stage_dir/Applications"

            for attempt in 1 2 3 4 5; do
              if hdiutil create -volname "$vol_name" -srcfolder "$stage_dir" -ov -fs HFS+ -format UDZO "$dmg_out"; then
                break
              fi
              echo "hdiutil attempt $attempt failed, retrying in 3s..."
              sleep 3
            done
            rm -rf "$stage_dir"
            test -f "$dmg_out"
          }

          echo "=== [4/4] Packaging .dmg installers (Apple Silicon, Intel, Universal) ==="
          package_dmg "target/aarch64-apple-darwin/release/zalo-rust" "dist/ctdozlite-${VER}-macos-arm64.dmg" "ctdozlite (Apple Silicon)"
          package_dmg "target/x86_64-apple-darwin/release/zalo-rust" "dist/ctdozlite-${VER}-macos-x86_64.dmg" "ctdozlite (Intel)"
          package_dmg "target/universal-apple-darwin/release/zalo-rust" "dist/ctdozlite-${VER}-macos.dmg" "ctdozlite"
          ls -lh dist/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: ctdozlite-macos-dmg
          path: dist/*.dmg
  release:
    name: Publish GitHub Release
    needs: [prepare, linux-packages, linux-legacy-glibc231, windows-exe, macos-dmg]
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.prepare.result == 'success' && needs.linux-packages.result == 'success' && needs.linux-legacy-glibc231.result == 'success' && needs.windows-exe.result == 'success' && needs.macos-dmg.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true
      - name: Generate SHA256SUMS.txt & latest.json update manifest
        run: |
          cd release_assets
          sha256sum * > SHA256SUMS.txt
          VER="${GITHUB_REF_NAME#v}"
          cat > latest.json << EOF
          {
            "version": "${VER}",
            "tag_name": "${GITHUB_REF_NAME}",
            "repository": "https://github.com/ctdoteam1110/ctdozlite"
          }
          EOF
          cat SHA256SUMS.txt
      # Install instructions live in docs/CAI_DAT.md. The release body only links to
      # them; the PR list, contributors and Full Changelog are generated by GitHub.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ctdozlite ${{ github.ref_name }}
          files: release_assets/*
          generate_release_notes: true
          body: |
            > **Hướng dẫn cài đặt:** [docs/CAI_DAT.md](https://github.com/ctdoteam1110/ctdozlite/blob/main/docs/CAI_DAT.md) · **Trang chủ:** https://ctdozlite.ctdo.net/
            >
            > Chọn đúng gói trong mục **Assets** bên dưới cho hệ điều hành của bạn (hỗ trợ Linux `.deb`/`.rpm`/`.AppImage`/`.tar.gz`, Windows `.exe`, và macOS `.dmg` cho cả **Apple Silicon M1/M2/M3/M4 `arm64`**, **Mac Intel `x86_64`** & **Universal**).


  # PR Bot: Auto-checks PR for leaked credentials, conventional title and Rust format
  pr-guard:
    name: PR Quality & Security Guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect PR Diff & Security
        id: check
        shell: bash
        run: |
          set +e

          # 1. Check for leaked sensitive files
          LEAKED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '^(session\.json|.*\.db|.*\.log|dump/|.*\.pem|.*\.key|re-notes/voicecall_capture\.log|app_settings\.json)$' || true)
          if [ -n "$LEAKED_FILES" ]; then
            LEAK_STATUS="FAIL"
            LEAK_MSG="Phát hiện file nhạy cảm trong commit diff:<br>```<br>$LEAKED_FILES<br>```<br>-> **Yêu cầu loại bỏ file nhạy cảm trước khi merge!**"
          else
            LEAK_STATUS="PASS"
            LEAK_MSG="Không phát hiện file nhạy cảm hoặc credentials rò rỉ."
          fi

          # 2. Check Conventional Commits title
          PR_TITLE="${{ github.event.pull_request.title }}"
          if echo "$PR_TITLE" | grep -Eq '^(feat|fix|refactor|perf|test|docs|chore|ci|style)(\([a-z0-9_-]+\))?: .+'; then
            TITLE_STATUS="PASS"
            TITLE_MSG="Tiêu đề chuẩn Conventional Commits (`$PR_TITLE`)."
          else
            TITLE_STATUS="WARN"
            TITLE_MSG="Tiêu đề chưa đúng chuẩn Conventional Commits (ví dụ: `feat(ui): thêm nút...`)."
          fi

          # 3. Check PR description
          BODY="${{ github.event.pull_request.body }}"
          BODY_LEN=${#BODY}
          if [ $BODY_LEN -gt 40 ]; then
            BODY_STATUS="PASS"
            BODY_MSG="Mô tả PR đầy đủ thông tin ($BODY_LEN ký tự)."
          else
            BODY_STATUS="WARN"
            BODY_MSG="Mô tả PR khá ngắn. Vui lòng bổ sung mục tiêu (`## What`) và lý do (`## Why`)."
          fi

          echo "leak_status=$LEAK_STATUS" >> $GITHUB_OUTPUT
          echo "leak_msg<<EOF" >> $GITHUB_OUTPUT
          echo -e "$LEAK_MSG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "title_status=$TITLE_STATUS" >> $GITHUB_OUTPUT
          echo "title_msg<<EOF" >> $GITHUB_OUTPUT
          echo -e "$TITLE_MSG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "body_status=$BODY_STATUS" >> $GITHUB_OUTPUT
          echo "body_msg<<EOF" >> $GITHUB_OUTPUT
          echo -e "$BODY_MSG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post Checklist Comment to PR
        uses: actions/github-script@v7
        with:
          script: |
            const leakStatus = "${{ steps.check.outputs.leak_status }}";
            const leakMsg = `${{ steps.check.outputs.leak_msg }}`;
            const titleStatus = "${{ steps.check.outputs.title_status }}";
            const titleMsg = `${{ steps.check.outputs.title_msg }}`;
            const bodyStatus = "${{ steps.check.outputs.body_status }}";
            const bodyMsg = `${{ steps.check.outputs.body_msg }}`;

            function icon(status) {
              if (status === 'PASS') return '✅ **ĐẠT**';
              if (status === 'WARN') return '⚠️ **LƯU Ý**';
              if (status === 'FAIL') return '❌ **KHÔNG ĐẠT**';
              return '➖ **BỎ QUA**';
            }

            const commentBody = `### 🤖 ctdozlite PR Check Bot (Miễn phí 100%)

Chào bạn! Bot tự động đã phân tích Pull Request của bạn theo quy chuẩn của dự án:

| Hạng mục kiểm tra | Trạng thái | Chi tiết |
| :--- | :---: | :--- |
| **Bảo mật & Tránh rò rỉ dữ liệu** | ${icon(leakStatus)} | ${leakMsg} |
| **Chuẩn tiêu đề (Conventional Commits)** | ${icon(titleStatus)} | ${titleMsg} |
| **Mô tả Pull Request** | ${icon(bodyStatus)} | ${bodyMsg} |

