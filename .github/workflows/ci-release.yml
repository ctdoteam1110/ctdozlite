name: macOS Apple Silicon release

on:
  push:
    branches: [main, codex/macos-arm64-public-release]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-arm64-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  build:
    name: Test and package Apple Silicon
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Check the declared minimum Rust version (rust-version = 1.95)
        run: |
          rustup toolchain install 1.95 --profile minimal --target aarch64-apple-darwin
          cargo +1.95 check --locked --target aarch64-apple-darwin --all-targets
      - name: Check version and host architecture
        run: |
          test "$(uname -m)" = arm64
          version=$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "ctdozlite"))')
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
      - name: Run Rust regression tests
        run: cargo test --release --locked --target aarch64-apple-darwin
      - name: Audit release dependencies
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit
      - name: Build public DMG and validate native helpers
        run: bash packaging/package-local.sh
      - name: Verify native packaging contracts
        env:
          NATIVE_TEST_ARCHES: arm64
        run: python3 tests/native_packaging.py
      - name: Verify macOS update transaction
        run: python3 tests/macos_update.py
      - name: Generate checksums and fallback manifest
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: python3 packaging/release-metadata.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: ctdozlite-macos-arm64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish verified Apple Silicon release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ctdozlite-macos-arm64
          path: dist
      - name: Verify CI artifacts and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum -c SHA256SUMS.txt
          cd ..
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --latest \
            --title "ctdozlite $GITHUB_REF_NAME — macOS Apple Silicon · Liquid Glass" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"
