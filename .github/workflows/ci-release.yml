name: CI & Cross-Platform Release (.deb / .rpm / .AppImage / .tar.gz / .exe / .dmg)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  # 1. Universal Linux packages built on Ubuntu 22.04 LTS (glibc 2.35, statically linked libopus + sqlite3 + rustls)
  # Produces: .deb (Debian/Ubuntu/Mint/Kali/Pop!_OS), .rpm (Fedora/RHEL/Rocky/Alma/openSUSE), .AppImage (all distros), .tar.gz (Arch/Void/Gentoo/any distro)
  linux-packages:
    name: Linux Multi-Format (.deb / .rpm / .AppImage / .tar.gz)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install build & packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config \
            libasound2-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev \
            libgtk-3-dev rpm file desktop-file-utils libfuse2
      - name: Run test suite
        run: cargo test --locked
      - name: Build release binary (static libopus & sqlite3)
        run: |
          cargo build --release --locked --bin zalo-rust
          strip target/release/zalo-rust
          chmod +x packaging/linux/ctdozlite packaging/linux/install.sh packaging/linux/uninstall.sh
      - name: Package .deb (Debian / Ubuntu 22.04+ / Linux Mint / Kali / Pop!_OS / Zorin)
        run: |
          mkdir -p dist pkg_deb/DEBIAN pkg_deb/usr/bin pkg_deb/usr/share/applications pkg_deb/usr/share/icons/hicolor/256x256/apps
          cp target/release/zalo-rust pkg_deb/usr/bin/zalo-rust
          cp packaging/linux/ctdozlite pkg_deb/usr/bin/ctdozlite
          cp packaging/linux/ctdozlite.desktop pkg_deb/usr/share/applications/ctdozlite.desktop
          cp src/assets/app_icon.png pkg_deb/usr/share/icons/hicolor/256x256/apps/ctdozlite.png
          cat > pkg_deb/DEBIAN/control << 'EOF'
          Package: ctdozlite
          Version: 0.0.1
          Section: net
          Priority: optional
          Architecture: amd64
          Depends: libc6, libasound2 | libasound2t64, libx11-6, libxcb1, libxkbcommon0, libgl1
          Recommends: ffmpeg, zenity, xclip, wl-clipboard, fonts-noto-core
          Maintainer: TIPC1110 <tienichpc1110@gmail.com>
          Description: Lightweight native Zalo PC client written in Rust
          EOF
          dpkg-deb --build --root-owner-group pkg_deb dist/ctdozlite_0.0.1_amd64.deb
      - name: Package .rpm (Fedora / RHEL / Rocky / AlmaLinux / CentOS / openSUSE)
        run: |
          mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cat > rpmbuild/SPECS/ctdozlite.spec << 'EOF'
          Name:           ctdozlite
          Version:        0.0.1
          Release:        1
          Summary:        Native Zalo Desktop Client written in Rust
          License:        MIT OR Apache-2.0
          URL:            https://github.com/ctdoteam1110/ctdozlite
          BuildArch:      x86_64
          AutoReqProv:    no
          Requires:       alsa-lib, libX11, libxcb, libxkbcommon

          %description
          Lightweight native Zalo Desktop Client written in Rust (eframe/egui + ratatui).

          %install
          mkdir -p %{buildroot}/usr/bin
          mkdir -p %{buildroot}/usr/share/applications
          mkdir -p %{buildroot}/usr/share/icons/hicolor/256x256/apps
          install -m 755 %{_topdir}/../target/release/zalo-rust %{buildroot}/usr/bin/zalo-rust
          install -m 755 %{_topdir}/../packaging/linux/ctdozlite %{buildroot}/usr/bin/ctdozlite
          install -m 644 %{_topdir}/../packaging/linux/ctdozlite.desktop %{buildroot}/usr/share/applications/ctdozlite.desktop
          install -m 644 %{_topdir}/../src/assets/app_icon.png %{buildroot}/usr/share/icons/hicolor/256x256/apps/ctdozlite.png

          %files
          /usr/bin/zalo-rust
          /usr/bin/ctdozlite
          /usr/share/applications/ctdozlite.desktop
          /usr/share/icons/hicolor/256x256/apps/ctdozlite.png
          EOF
          rpmbuild --define "_topdir $(pwd)/rpmbuild" -bb rpmbuild/SPECS/ctdozlite.spec
          cp rpmbuild/RPMS/x86_64/*.rpm dist/ctdozlite-0.0.1-1.x86_64.rpm
      - name: Package .AppImage (Universal single-file executable for all Linux distros)
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp target/release/zalo-rust AppDir/usr/bin/zalo-rust
          cp packaging/linux/ctdozlite AppDir/usr/bin/ctdozlite
          cp packaging/linux/ctdozlite.desktop AppDir/ctdozlite.desktop
          cp packaging/linux/ctdozlite.desktop AppDir/usr/share/applications/ctdozlite.desktop
          cp src/assets/app_icon.png AppDir/ctdozlite.png
          cp src/assets/app_icon.png AppDir/.DirIcon
          cp src/assets/app_icon.png AppDir/usr/share/icons/hicolor/256x256/apps/ctdozlite.png
          cat > AppDir/AppRun << 'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          export PATH="${HERE}/usr/bin:${PATH}"
          if [ $# -eq 0 ]; then
              exec "${HERE}/usr/bin/zalo-rust" --gui
          else
              exec "${HERE}/usr/bin/zalo-rust" "$@"
          fi
          EOF
          chmod +x AppDir/AppRun
          curl -fsSL -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir dist/ctdozlite-0.0.1-x86_64.AppImage
          chmod +x dist/ctdozlite-0.0.1-x86_64.AppImage
      - name: Package portable .tar.gz with universal install.sh (Arch / Manjaro / Gentoo / Void / any Linux)
        run: |
          STAGE="ctdozlite-0.0.1-linux-x86_64"
          mkdir -p "$STAGE"
          cp target/release/zalo-rust "$STAGE/zalo-rust"
          cp packaging/linux/ctdozlite "$STAGE/ctdozlite"
          cp packaging/linux/install.sh "$STAGE/install.sh"
          cp packaging/linux/uninstall.sh "$STAGE/uninstall.sh"
          cp packaging/linux/ctdozlite.desktop "$STAGE/ctdozlite.desktop"
          cp src/assets/app_icon.png "$STAGE/ctdozlite.png"
          cp README.md LICENSE-MIT LICENSE-APACHE "$STAGE/"
          chmod +x "$STAGE/zalo-rust" "$STAGE/ctdozlite" "$STAGE/install.sh" "$STAGE/uninstall.sh"
          tar -czf "dist/${STAGE}.tar.gz" "$STAGE"
      - uses: actions/upload-artifact@v4
        with:
          name: ctdozlite-linux-packages
          path: dist/*

  # 2. Legacy Linux build on Debian 11 Bullseye (glibc 2.31) for older distros (Ubuntu 20.04, Debian 11, Mint 20, RHEL/Rocky 8.x/9.x)
  linux-legacy-glibc231:
    name: Linux Legacy glibc 2.31 (Debian 11 / Ubuntu 20.04+)
    runs-on: ubuntu-22.04
    container:
      image: rust:bullseye
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies & update Rust stable (Debian 11 Bullseye)
        run: |
          sed -i '/bullseye-security/d' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          apt-get update
          apt-get install -y --no-upgrade build-essential cmake pkg-config \
            libasound2-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev \
            libgtk-3-dev
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: bullseye-glibc231
      - name: Build legacy release binary & .deb + .tar.gz
        run: |
          cargo build --release --locked --bin zalo-rust
          strip target/release/zalo-rust
          chmod +x packaging/linux/ctdozlite packaging/linux/install.sh packaging/linux/uninstall.sh
          mkdir -p dist pkg_deb/DEBIAN pkg_deb/usr/bin pkg_deb/usr/share/applications pkg_deb/usr/share/icons/hicolor/256x256/apps
          cp target/release/zalo-rust pkg_deb/usr/bin/zalo-rust
          cp packaging/linux/ctdozlite pkg_deb/usr/bin/ctdozlite
          cp packaging/linux/ctdozlite.desktop pkg_deb/usr/share/applications/ctdozlite.desktop
          cp src/assets/app_icon.png pkg_deb/usr/share/icons/hicolor/256x256/apps/ctdozlite.png
          cat > pkg_deb/DEBIAN/control << 'EOF'
          Package: ctdozlite
          Version: 0.0.1
          Section: net
          Priority: optional
          Architecture: amd64
          Depends: libc6 (>= 2.31), libasound2 | libasound2t64
          Recommends: ffmpeg, zenity, xclip, wl-clipboard, fonts-noto-core
          Maintainer: TIPC1110 <tienichpc1110@gmail.com>
          Description: Lightweight native Zalo PC client written in Rust (glibc 2.31+ compatible)
          EOF
          dpkg-deb --build --root-owner-group pkg_deb dist/ctdozlite_0.0.1_legacy_glibc2.31_amd64.deb

          STAGE="ctdozlite-0.0.1-linux-x86_64-legacy-glibc2.31"
          mkdir -p "$STAGE"
          cp target/release/zalo-rust "$STAGE/zalo-rust"
          cp packaging/linux/ctdozlite "$STAGE/ctdozlite"
          cp packaging/linux/install.sh "$STAGE/install.sh"
          cp packaging/linux/uninstall.sh "$STAGE/uninstall.sh"
          cp packaging/linux/ctdozlite.desktop "$STAGE/ctdozlite.desktop"
          cp src/assets/app_icon.png "$STAGE/ctdozlite.png"
          cp README.md LICENSE-MIT LICENSE-APACHE "$STAGE/"
          chmod +x "$STAGE/zalo-rust" "$STAGE/ctdozlite" "$STAGE/install.sh" "$STAGE/uninstall.sh"
          tar -czf "dist/${STAGE}.tar.gz" "$STAGE"
      - uses: actions/upload-artifact@v4
        with:
          name: ctdozlite-linux-legacy
          path: dist/*

  windows-exe:
    name: Windows (MSVC x86_64 + .exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run test suite
        run: cargo test --locked
      - name: Build release binary & installer
        shell: pwsh
        run: |
          cargo build --release --locked --bin zalo-rust
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\zalo-rust.exe dist\ctdozlite-0.0.1-portable-windows-x86_64.exe
          iscc packaging\windows\installer.iss
          Move-Item dist\ctdozlite-setup-windows-x86_64.exe dist\ctdozlite-0.0.1-setup-windows-x86_64.exe -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ctdozlite-windows-exe
          path: dist/*.exe

  macos-dmg:
    name: macOS (${{ matrix.arch }} + .dmg)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Homebrew dependencies
        run: brew install cmake pkg-config opus
      - name: Run test suite
        run: cargo test --locked
      - name: Build release app bundle & .dmg
        run: |
          cargo build --release --locked --bin zalo-rust
          mkdir -p dist/dmg/ctdozlite.app/Contents/MacOS
          mkdir -p dist/dmg/ctdozlite.app/Contents/Resources
          cp target/release/zalo-rust dist/dmg/ctdozlite.app/Contents/MacOS/zalo-rust
          cp packaging/macos/Info.plist dist/dmg/ctdozlite.app/Contents/Info.plist
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "ctdozlite" -srcfolder dist/dmg -ov -format UDZO dist/ctdozlite-0.0.1-macos-${{ matrix.arch }}.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: ctdozlite-macos-dmg-${{ matrix.arch }}
          path: dist/*.dmg

  release:
    name: Publish GitHub Release
    needs: [linux-packages, linux-legacy-glibc231, windows-exe, macos-dmg]
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.linux-packages.result == 'success' && needs.windows-exe.result == 'success' && needs.macos-dmg.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true
      - name: Generate SHA256SUMS.txt
        run: |
          cd release_assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: true
          body: |
            ### ctdozlite ${{ github.ref_name }} — Native Zalo Desktop Client in Rust

            #### 🐧 Bản cài đặt cho Linux (Hỗ trợ mọi bản phân phối Linux)
            - **Ubuntu 22.04 / 24.04 / Debian 12+ / Linux Mint 21+ / Kali / Pop!_OS / Zorin:**
              Tải `ctdozlite_0.0.1_amd64.deb` và chạy:
              ```bash
              sudo apt install ./ctdozlite_0.0.1_amd64.deb
              ```
            - **Ubuntu 20.04 / Debian 11 / Linux Mint 20 (Máy Linux đời cũ `glibc >= 2.31`):**
              Tải `ctdozlite_0.0.1_legacy_glibc2.31_amd64.deb` và chạy:
              ```bash
              sudo apt install ./ctdozlite_0.0.1_legacy_glibc2.31_amd64.deb
              ```
            - **Fedora / RHEL / Rocky Linux / AlmaLinux / CentOS / openSUSE:**
              Tải `ctdozlite-0.0.1-1.x86_64.rpm` và chạy:
              ```bash
              sudo dnf install ./ctdozlite-0.0.1-1.x86_64.rpm
              ```
            - **AppImage (Chạy ngay trên mọi bản Linux không cần cài đặt):**
              Tải `ctdozlite-0.0.1-x86_64.AppImage` và chạy:
              ```bash
              chmod +x ctdozlite-0.0.1-x86_64.AppImage
              ./ctdozlite-0.0.1-x86_64.AppImage
              ```
            - **Arch Linux / Manjaro / EndeavourOS / Gentoo / Void / Mọi distro khác (`.tar.gz`):**
              Tải `ctdozlite-0.0.1-linux-x86_64.tar.gz` (hoặc bản `legacy-glibc2.31`), giải nén và chạy `./install.sh`.

            #### 🪟 Bản cài đặt cho Windows (x64)
            - Bộ cài đặt: `ctdozlite-0.0.1-setup-windows-x86_64.exe`
            - Bản chạy ngay (Portable): `ctdozlite-0.0.1-portable-windows-x86_64.exe`

            #### 🍎 Bản cài đặt cho macOS
            - Apple Silicon (M1/M2/M3/M4): `ctdozlite-0.0.1-macos-arm64.dmg`
            - Intel: `ctdozlite-0.0.1-macos-x86_64.dmg`
