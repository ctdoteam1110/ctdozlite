[book]
title = "ctdozlite"
description = "Tài liệu người dùng ctdozlite — Zalo desktop client viết bằng Rust"
authors = ["CTDOTEAM"]
language = "vi"
src = "docs"

[build]
build-dir = "book"

[output.html]
default-theme = "dark"
site-url = "/docs/"
git-repository-url = "https://github.com/ctdoteam1110/ctdozlite"
edit-url-template = "https://github.com/ctdoteam1110/ctdozlite/edit/main/docs/{path}"

[output.html.search]
enable = true
