[package]
name = "ctdozlite"
version = "0.0.9"
edition = "2021"
# Lowest toolchain the code builds with (AtomicU64::try_update needs 1.95); checked in CI.
rust-version = "1.95"
authors = ["TIPC1110 <tienichpc1110@gmail.com>"]
description = "Native Zalo PC client in Rust; optional phone history helper uses local Node.js"
homepage = "https://ctdozlite.ctdo.net/"
repository = "https://github.com/lebad280324/ctdozlite"
license = "MIT OR Apache-2.0"
default-run = "ctdozlite"

[dependencies]
aes = "0.8"
cbc = "0.1"
cipher = "0.4"
md-5 = "0.10"
sha2 = "0.10"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["cookies", "json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync", "process"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
aes-gcm = "0.10"
flate2 = "1"
generic-array = "0.14"
anyhow = "1"
qrcode = { version = "0.14.1", default-features = false }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "tiff"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache", "underline-color"] }
crossterm = "0.29"
rusqlite = { version = "0.32", features = ["bundled"] }
cpal = "0.15"
opus = "0.3"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# Constant-time RSA (PKCS#1 v1.5) for phone-sync key unwrapping; replaces `rsa` (ADR-0005).
aws-lc-rs = "1.16"
# Wipes the ephemeral RSA private key and the unwrapped backup key from memory (ADR-0005).
zeroize = "1"
lzma-rs = "0.3.0"
zstd = "0.14.3"
raw-window-handle = "0.6"

[lib]
name = "zalo_rust"
path = "src/lib.rs"

[[bin]]
name = "ctdozlite"
path = "src/main.rs"

[[bin]]
name = "compare"
path = "src/bin/compare.rs"

[[bin]]
name = "probe_media"
path = "src/bin/probe_media.rs"

[[bin]]
name = "test_fetch"
path = "src/bin/test_fetch.rs"

[[bin]]
name = "test_qr_tag"
path = "src/bin/test_qr_tag.rs"

[[bin]]
name = "call_probe"
path = "src/bin/call_probe.rs"

[[bin]]
name = "view_feed"
path = "src/bin/view_feed.rs"

[package.metadata.deb]
name = "ctdozlite"
maintainer = "TIPC1110 <tienichpc1110@gmail.com>"
copyright = "2026, TIPC1110 <tienichpc1110@gmail.com>"
license-file = ["LICENSE-MIT", "0"]
depends = "libc6 (>= 2.31), libasound2 | libasound2t64, libx11-6, libxcb1, libxkbcommon0, libgl1"
recommends = "ffmpeg, zenity, xclip, wl-clipboard, fonts-noto-core"
section = "net"
priority = "optional"
assets = [
    ["target/release/ctdozlite", "usr/bin/", "755"],
    ["packaging/linux/ctdozlite", "usr/bin/", "755"],
    ["packaging/linux/ctdozlite.desktop", "usr/share/applications/", "644"],
    ["src/assets/app_icon.png", "usr/share/icons/hicolor/256x256/apps/ctdozlite.png", "644"],
    ["README.md", "usr/share/doc/ctdozlite/README.md", "644"],
]

[profile.release]
# Preserve PE debug/symbol metadata on Windows MSVC builds so unsigned binaries and
# Inno Setup installers do not trigger Microsoft Defender's stripped-PE ML heuristics (#58).
# Linux release jobs run `strip` explicitly in CI.
strip = "none"

[profile.dev]
debug = 0

[profile.test]
debug = 0

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = { version = "0.2", default-features = false, features = ["std", "NSResponder", "NSView", "NSGraphics", "NSPasteboard", "NSPasteboardItem", "NSWorkspace", "NSAccessibility"] }
objc2-foundation = { version = "0.2", default-features = false, features = ["std", "NSString", "NSData", "NSArray", "NSURL"] }
window-vibrancy = "0.5"
